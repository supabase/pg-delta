[test]
# Guard the test process against stray process.exit() calls in in-process code
# (CLI command handlers must throw and let main() be the sole exiter). See
# tests/no-process-exit-guard.ts. Applies only to `bun test`, so subprocess CLI
# runs (Bun.spawn ["bun", main.ts, …]) keep their real exit codes.
preload = ["./tests/no-process-exit-guard.ts"]
