name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed so the merge_group author lookup can read the queued PR's author
      # (merge_group events carry no pull_request payload).
      pull-requests: read
    outputs:
      pg-delta: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-delta }}
      pg-delta-package-json: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-delta-package-json }}
      pg-topo: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-topo }}
      pg-topo-package-json: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-topo-package-json }}
      pg-squash: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-squash }}
      pg-squash-package-json: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.pg-squash-package-json }}
      root: ${{ github.event_name == 'merge_group' && 'true' || steps.changes.outputs.root }}
      # 'true' only when the PR is authored by the changesets release bot AND
      # every changed file is in the release-PR whitelist (CHANGELOGs,
      # package.json version bumps, .changeset state). Both guards must hold:
      # the author check stops anyone from bypassing CI with a whitelist-only
      # PR, and any extra file flips the content check back to 'false' so the
      # heavy suite runs. Enforced on both the pull_request and merge_group
      # events (see the release-author step for how the author is resolved in
      # the queue, which carries no pull_request payload).
      is-release-pr: >-
        ${{
          steps.release-author.outputs.is-release-author == 'true'
          && steps.changes.outputs.is-release-pr-content == 'true'
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          # On merge_group there is no PR base for paths-filter to auto-detect,
          # so diff against the merge group base sha (the cumulative queued
          # diff). Empty on pull_request keeps paths-filter's PR auto-detection.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
      - name: Resolve release-PR author
        id: release-author
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # Externally influenced values are passed via env (never interpolated
          # into the script body) to avoid shell injection from branch names.
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # merge_group head ref looks like
          # refs/heads/gh-readonly-queue/main/pr-271-<base_sha>; the PR number
          # is the only author signal available in the queue.
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          RELEASE_BOT="supabase-releaser[bot]"
          AUTHOR=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Defense in depth: require both the release branch and the bot.
            if [ "$PR_HEAD_REF" = "changeset-release/main" ]; then
              AUTHOR="$PR_AUTHOR"
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            PR_NUMBER=$(printf '%s' "$MERGE_GROUP_HEAD_REF" | sed -n 's#.*/pr-\([0-9]\{1,\}\)-.*#\1#p')
            if [ -n "$PR_NUMBER" ]; then
              AUTHOR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.user.login' 2>/dev/null || echo "")
            fi
          fi
          if [ "$AUTHOR" = "$RELEASE_BOT" ]; then
            echo "is-release-author=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release-author=false" >> "$GITHUB_OUTPUT"
          fi

  check-types:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: detect-changes
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      # pg-delta type-checks its optional @supabase/pg-topo peer through the
      # `types` field (dist/*.d.ts), which is gitignored and not produced by
      # install. Build it so the sql-order reorder assist type-checks.
      - name: Build @supabase/pg-topo (provides .d.ts for the type check)
        if: needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.root == 'true'
        working-directory: packages/pg-topo
        run: bun run build
      - name: Build @supabase/pg-delta (provides .d.ts for pg-squash)
        if: needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.root == 'true'
        working-directory: packages/pg-delta
        run: bun run build
      - name: Check types (pg-delta)
        # pg-delta imports @supabase/pg-topo at runtime, so a pg-topo change
        # (e.g. an exported-type or ordering-contract change) must re-run
        # pg-delta's suites even when no packages/pg-delta/** file changed.
        if: needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-delta' check-types
      - name: Check types (pg-topo)
        if: needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-topo' check-types
      - name: Check types (pg-squash)
        if: needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-squash' check-types

  format-and-lint:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: detect-changes
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      # pg-delta type-checks its optional @supabase/pg-topo peer through the
      # `types` field (dist/*.d.ts), which is gitignored and not produced by
      # install. oxlint-tsgolint does real type-checking, so it needs the same
      # build the check-types job requires.
      - name: Build @supabase/pg-topo (provides .d.ts for oxlint-tsgolint)
        working-directory: packages/pg-topo
        run: bun run build
      - name: Build @supabase/pg-delta (provides .d.ts for pg-squash oxlint)
        working-directory: packages/pg-delta
        run: bun run build
      - name: Format and lint
        run: bun run format-and-lint
      - name: Test contribution gate
        run: bun run test:contribution-gate

  knip:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: detect-changes
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Knip (pg-delta)
        if: needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-delta' knip
      - name: Knip (pg-topo)
        if: needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-topo' knip
      - name: Knip (pg-squash)
        if: needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.root == 'true'
        run: bun run --filter '@supabase/pg-squash' knip

  pg-delta-unit:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-delta: Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run unit tests
        working-directory: packages/pg-delta
        run: bun test src/

  pg-delta-corpus:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-delta: Corpus (PG ${{ matrix.postgres_version }}, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ["14", "15", "16", "17", "18"]
        shard:
          - "0/10"
          - "1/10"
          - "2/10"
          - "3/10"
          - "4/10"
          - "5/10"
          - "6/10"
          - "7/10"
          - "8/10"
          - "9/10"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Corpus proof loop (both directions)
        working-directory: packages/pg-delta
        env:
          PGDELTA_TEST_IMAGE: postgres:${{ matrix.postgres_version }}-alpine
          PGDELTA_NEXT_SHARD: ${{ matrix.shard }}
          # Public-repo standard runners have 4 vCPUs; engine.test.ts caps the
          # pool to the core count anyway. With concurrency > 1 bun's per-case
          # reporting collapses into one aggregate test, so PGDELTA_NEXT_PROGRESS
          # keeps a per-case PASS/FAIL line in the job log.
          PGDELTA_NEXT_CONCURRENCY: "4"
          PGDELTA_NEXT_PROGRESS: "1"
        run: bun test tests/engine.test.ts

  pg-delta-integration:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-delta == 'true' || needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-delta: Integration (PG ${{ matrix.postgres_version }}, group ${{ matrix.group }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ["14", "15", "16", "17", "18"]
        group: ["0", "1", "2", "3", "4"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run integration tests (everything except the corpus proof loop)
        working-directory: packages/pg-delta
        env:
          PGDELTA_TEST_IMAGE: postgres:${{ matrix.postgres_version }}-alpine
          GROUP: ${{ matrix.group }}
        run: |
          # The corpus proof loop (engine.test.ts) runs in its own sharded job.
          # The remaining files are split across 5 groups so no single job
          # serializes ~5 minutes of tests. The few files that dominate wall
          # time get pinned groups (0 and 1) — a blind round-robin can put two
          # of them in the same group and recreate the bottleneck. Everything
          # else (including any newly added test file) round-robins into
          # groups 2/3/4. Pinned files are selected via `grep -xF` against the
          # discovered list, so a renamed/deleted pin drops out gracefully
          # instead of failing `bun test` with a missing path.
          HEAVY_0=$(printf '%s\n' tests/fixture-validity.test.ts tests/security-label-proof.test.ts)
          HEAVY_1=$(printf '%s\n' tests/cli.test.ts tests/extension-intent-cron-privileges.test.ts tests/generative.test.ts)
          ALL=$(find tests -maxdepth 1 -name '*.test.ts' ! -name 'engine.test.ts' | sort)
          # `|| true`: grep exits 1 on zero matches, which under the runner's
          # `bash -e` would abort the step before the empty-FILES guard below
          # can turn "all pins renamed" into a graceful no-op.
          REST=$(printf '%s\n' "$ALL" | grep -vxF "$HEAVY_0" | grep -vxF "$HEAVY_1" || true)
          case "$GROUP" in
            0) FILES=$(printf '%s\n' "$ALL" | grep -xF "$HEAVY_0" || true) ;;
            1) FILES=$(printf '%s\n' "$ALL" | grep -xF "$HEAVY_1" || true) ;;
            2) FILES=$(printf '%s\n' "$REST" | awk 'NR % 3 == 0') ;;
            3) FILES=$(printf '%s\n' "$REST" | awk 'NR % 3 == 1') ;;
            4) FILES=$(printf '%s\n' "$REST" | awk 'NR % 3 == 2') ;;
          esac
          if [ -z "$FILES" ]; then
            echo "No test files in group $GROUP (pinned files renamed?); nothing to run."
            exit 0
          fi
          printf '%s\n' "$FILES" | xargs bun test

  # Stable status-check names for branch protection. The integration/corpus
  # matrices produce per-version/per-shard job names that are unstable to
  # require directly, so these aggregators expose a fixed pass/fail signal.
  pg-delta-integration-pg15-compat:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      # detect-changes must be a direct dependency so this aggregator can tell
      # "no pg-delta changes → matrices legitimately skipped" (stay green) apart
      # from "detect-changes itself FAILED → matrices skipped through unmet needs"
      # (must fail). Without it the always() gate below accepts the skipped
      # matrices as success and the aggregator goes green on a broken run.
      - detect-changes
      - pg-delta-corpus
      - pg-delta-integration
    name: "pg-delta: Integration (PostgreSQL 15)"
    runs-on: ubuntu-latest
    steps:
      - name: Validate detect-changes result
        # A failed/cancelled detect-changes skips the matrices through unmet
        # needs; that must fail the aggregator rather than pass on the skips
        # below. A successful/skipped detect-changes (no pg-delta changes) is a
        # legitimate skip and stays green.
        run: |
          if [ "${{ needs.detect-changes.result }}" == "failure" ] || [ "${{ needs.detect-changes.result }}" == "cancelled" ]; then
            echo "detect-changes result: ${{ needs.detect-changes.result }}"
            exit 1
          fi
      - name: Validate corpus matrix status
        run: |
          if [ "${{ needs.pg-delta-corpus.result }}" != "success" ] && [ "${{ needs.pg-delta-corpus.result }}" != "skipped" ]; then
            echo "Corpus matrix status: ${{ needs.pg-delta-corpus.result }}"
            exit 1
          fi
      - name: Validate integration matrix status
        run: |
          if [ "${{ needs.pg-delta-integration.result }}" != "success" ] && [ "${{ needs.pg-delta-integration.result }}" != "skipped" ]; then
            echo "Integration matrix status: ${{ needs.pg-delta-integration.result }}"
            exit 1
          fi

  pg-delta-integration-pg17-compat:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      # detect-changes must be a direct dependency so this aggregator can tell
      # "no pg-delta changes → matrices legitimately skipped" (stay green) apart
      # from "detect-changes itself FAILED → matrices skipped through unmet needs"
      # (must fail). Without it the always() gate below accepts the skipped
      # matrices as success and the aggregator goes green on a broken run.
      - detect-changes
      - pg-delta-corpus
      - pg-delta-integration
    name: "pg-delta: Integration (PostgreSQL 17)"
    runs-on: ubuntu-latest
    steps:
      - name: Validate detect-changes result
        # A failed/cancelled detect-changes skips the matrices through unmet
        # needs; that must fail the aggregator rather than pass on the skips
        # below. A successful/skipped detect-changes (no pg-delta changes) is a
        # legitimate skip and stays green.
        run: |
          if [ "${{ needs.detect-changes.result }}" == "failure" ] || [ "${{ needs.detect-changes.result }}" == "cancelled" ]; then
            echo "detect-changes result: ${{ needs.detect-changes.result }}"
            exit 1
          fi
      - name: Validate corpus matrix status
        run: |
          if [ "${{ needs.pg-delta-corpus.result }}" != "success" ] && [ "${{ needs.pg-delta-corpus.result }}" != "skipped" ]; then
            echo "Corpus matrix status: ${{ needs.pg-delta-corpus.result }}"
            exit 1
          fi
      - name: Validate integration matrix status
        run: |
          if [ "${{ needs.pg-delta-integration.result }}" != "success" ] && [ "${{ needs.pg-delta-integration.result }}" != "skipped" ]; then
            echo "Integration matrix status: ${{ needs.pg-delta-integration.result }}"
            exit 1
          fi

  pg-topo-tests:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-topo == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-topo: Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run tests
        working-directory: packages/pg-topo
        env:
          BUN_COVERAGE: "1"
          NYC_OUTPUT_DIR: ${{ github.workspace }}/packages/pg-topo/.nyc_output
        run: bun run test
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-pg-topo
          path: packages/pg-topo/.nyc_output/
          retention-days: 1
          include-hidden-files: true

  pg-squash-unit:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-squash: Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run unit tests
        working-directory: packages/pg-squash
        run: bun test src/

  pg-squash-corpus:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.detect-changes.outputs.pg-squash == 'true' || needs.detect-changes.outputs.root == 'true')
    needs: detect-changes
    name: "pg-squash: Corpus (PG ${{ matrix.postgres_version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ["17"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Integration and corpus
        working-directory: packages/pg-squash
        env:
          PGDELTA_TEST_IMAGE: postgres:${{ matrix.postgres_version }}-alpine
        run: bun test tests/

  coverage:
    if: >-
      !cancelled() &&
      needs.pg-topo-tests.result != 'skipped'
    continue-on-error: true
    needs:
      - pg-topo-tests
    name: "Coverage report"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download all coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          path: .nyc_output/
          merge-multiple: true
      - name: Generate coverage report
        run: |
          if [ ! -d .nyc_output ] || [ -z "$(ls -A .nyc_output 2>/dev/null)" ]; then
            echo "No coverage artifacts found, skipping report"
            {
              echo "## Coverage Summary"
              echo "No coverage data was uploaded."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            npx nyc report
            SUMMARY=".coverage-artifacts/coverage-summary.json"
            if [ -f "$SUMMARY" ]; then
              bun -e "
                const data = JSON.parse(require('fs').readFileSync('$SUMMARY', 'utf8')).total;
                const fmt = (m) => {
                  const pct = m.pct.toFixed(1);
                  const icon = m.pct >= 80 ? '🟢' : m.pct >= 60 ? '🟡' : '🔴';
                  return \`\${icon} \${pct}%\`;
                };
                const row = (label, m) =>
                  \`| \${label} | \${fmt(m)} | \${m.covered} / \${m.total} |\`;
                const lines = [
                  '## Coverage Summary',
                  '',
                  '| Metric | Coverage | Covered / Total |',
                  '|--------|:--------:|----------------:|',
                  row('Statements', data.statements),
                  row('Branches',   data.branches),
                  row('Functions',  data.functions),
                  row('Lines',      data.lines),
                ];
                process.stdout.write(lines.join('\n') + '\n');
              " >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "## Coverage Summary"
                echo "Coverage artifacts were downloaded, but coverage-summary.json was not generated."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload coverage reports
        if: hashFiles('.coverage-artifacts/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: .coverage-artifacts/
          retention-days: 30
          include-hidden-files: true

  deno2-library-e2e:
    if: >-
      needs.detect-changes.outputs.is-release-pr != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        needs.detect-changes.outputs.pg-delta-package-json == 'true' ||
        needs.detect-changes.outputs.pg-topo-package-json == 'true'
      )
    needs:
      - detect-changes
    name: "Deno 2: Library golden path e2e"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Run Deno e2e golden-path check
        run: node .github/scripts/deno-library-e2e.mjs

  release-preview:
    needs:
      - detect-changes
      - check-types
      - format-and-lint
      - knip
      - pg-delta-unit
      - pg-delta-integration-pg15-compat
      - pg-delta-integration-pg17-compat
      - pg-topo-tests
      - pg-squash-unit
      - pg-squash-corpus
      - deno2-library-e2e
    if: always() && !cancelled() && needs.detect-changes.outputs.is-release-pr != 'true'
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
