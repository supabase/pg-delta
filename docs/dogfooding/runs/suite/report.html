    <style>
      :root {
        --bg: #f6f8fa;
        --surface: #fff;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #1a7f37;
        --old-color: #8b949e;
        --new-color: #1a7f37;
        --warn-bg: #fff8c5;
        --max-width: 90rem;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      a {
        color: #0969da;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .layout {
        display: grid;
        grid-template-columns: 14rem 1fr;
        min-height: 100vh;
      }
      nav {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1rem 0.75rem;
      }
      nav h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0.5rem 0.75rem;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        font-size: 0.8rem;
        color: var(--text);
      }
      nav a:hover {
        background: var(--bg);
        text-decoration: none;
      }
      nav a.active {
        background: #ddf4ff;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      main {
        padding: 1.5rem 2rem 3rem;
        max-width: var(--max-width);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
      }
      .card .label {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .card .value {
        font-size: 1.4rem;
        font-weight: 600;
      }
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      @media (max-width: 900px) {
        .charts {
          grid-template-columns: 1fr;
        }
      }
      .chart-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
      }
      .chart-box h3 {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
      }
      .chart-box canvas {
        max-height: 280px;
      }
      .chart-controls {
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .filters label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.85rem;
        cursor: pointer;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
      }
      table.summary {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 2rem;
        font-size: 0.85rem;
      }
      table.summary th,
      table.summary td {
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      table.summary th {
        background: var(--bg);
        font-weight: 600;
      }
      table.summary tr.hidden {
        display: none;
      }
      table.summary tr.highlight {
        background: #fff8c5;
      }
      table.summary tr.mismatch {
        background: #fffbeb;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        color: #fff;
      }
      .scenario {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        overflow: hidden;
      }
      .scenario-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        padding: 0.75rem 1rem;
        cursor: pointer;
        user-select: none;
        background: var(--bg);
      }
      .scenario-header h2 {
        margin: 0;
        font-size: 1rem;
        flex: 1;
        min-width: 12rem;
      }
      .scenario-header .chevron {
        transition: transform 0.15s;
      }
      .scenario.open .chevron {
        transform: rotate(90deg);
      }
      .scenario-body {
        display: none;
        padding: 0 1rem 1rem;
      }
      .scenario.open .scenario-body {
        display: block;
      }
      .metrics-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }
      .chip {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.15rem 0.45rem;
      }
      .chip.warn {
        background: var(--warn-bg);
        border-color: #d4a72c;
      }
      .chip.error {
        background: #ffebe9;
        border-color: #ff8182;
        color: #cf222e;
      }
      .mini-chart {
        height: 28px;
        max-width: 280px;
        margin: 0.25rem 0;
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        padding: 0.4rem 0.75rem;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tab.active {
        color: var(--text);
        border-bottom-color: #0969da;
        font-weight: 600;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
      .sql-panes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        max-height: 480px;
        overflow: hidden;
      }
      .sql-pane {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .sql-pane .pane-label {
        background: var(--bg);
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      .sql-pane .pane-label.old {
        color: var(--old-color);
      }
      .sql-pane .pane-label.new {
        color: var(--new-color);
      }
      .sql-scroll {
        overflow: auto;
        flex: 1;
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
      }
      .sql-scroll pre {
        margin: 0;
        padding: 0.5rem;
      }
      .diff-container {
        overflow-x: auto;
        font-size: 0.8rem;
      }
      .stmt-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }
      .stmt-table th,
      .stmt-table td {
        border: 1px solid var(--border);
        padding: 0.4rem 0.6rem;
        vertical-align: top;
      }
      .stmt-table th {
        background: var(--bg);
        width: 2.5rem;
        text-align: center;
      }
      .stmt-table code {
        font-size: 0.78rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .collapsible {
        margin-top: 0.75rem;
      }
      .collapsible summary {
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .collapsible pre {
        background: var(--bg);
        padding: 0.75rem;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.75rem;
      }
      .error-box {
        background: #ffebe9;
        border: 1px solid #ff8182;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.75rem;
        font-size: 0.85rem;
        color: #cf222e;
      }
    </style>
  </head>

            "newSql": "CREATE SCHEMA \"app\" AUTHORIZATION \"postgres\"\n\nCREATE EXTENSION \"citext\" SCHEMA \"extensions\"\n\nCREATE EXTENSION \"pg_cron\"\n\nCREATE EXTENSION \"pg_trgm\" SCHEMA \"extensions\"\n\nCREATE TABLE \"app\".\"accounts\" (\"avatar_id\" uuid, \"bio\" text, \"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"display_name\" text, \"id\" uuid NOT NULL)\n\nALTER TABLE \"app\".\"accounts\" ENABLE ROW LEVEL SECURITY\n\nCREATE TABLE \"app\".\"handle_registry\" (\"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"is_organization\" boolean NOT NULL)\n\nCREATE TABLE \"app\".\"members\" (\"account_id\" uuid NOT NULL, \"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"id\" uuid NOT NULL DEFAULT uuid_generate_v4(), \"organization_id\" uuid NOT NULL)\n\nALTER TABLE \"app\".\"members\" ENABLE ROW LEVEL SECURITY\n\nCREATE TABLE \"app\".\"organizations\" (\"avatar_id\" uuid, \"bio\" text, \"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"display_name\" text, \"id\" uuid NOT NULL DEFAULT gen_random_uuid())\n\nALTER TABLE \"app\".\"organizations\" ENABLE ROW LEVEL SECURITY\n\nCREATE TABLE \"app\".\"package_upgrades\" (\"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"id\" uuid NOT NULL DEFAULT gen_random_uuid(), \"package_id\" uuid NOT NULL, \"sql\" character varying(250000))\n\nALTER TABLE \"app\".\"package_upgrades\" ENABLE ROW LEVEL SECURITY\n\nCREATE TABLE \"app\".\"package_versions\" (\"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"description_md\" character varying(250000), \"id\" uuid NOT NULL DEFAULT gen_random_uuid(), \"package_id\" uuid NOT NULL, \"sql\" character varying(250000))\n\nALTER TABLE \"app\".\"package_versions\" ENABLE ROW LEVEL SECURITY\n\nCREATE TABLE \"app\".\"packages\" (\"control_description\" character varying(1000), \"control_relocatable\" boolean NOT NULL DEFAULT false, \"control_requires\" character varying(128)[] DEFAULT '{}'::character varying(128)[], \"created_at\" timestamp with time zone NOT NULL DEFAULT now(), \"id\" uuid NOT NULL DEFAULT gen_random_uuid())\n\nALTER TABLE \"app\".\"packages\" ENABLE ROW LEVEL SECURITY\n\nALTER TABLE \"app\".\"accounts\" ADD COLUMN \"is_organization\" boolean GENERATED ALWAYS AS (false) STORED\n\nALTER TABLE \"app\".\"organizations\" ADD COLUMN \"is_organization\" boolean GENERATED ALWAYS AS (true) STORED\n\nCREATE DOMAIN \"app\".\"email_address\" AS citext\n\nALTER TABLE \"app\".\"accounts\" ADD COLUMN \"contact_email\" app.email_address\n\nALTER TABLE \"app\".\"organizations\" ADD COLUMN \"contact_email\" app.email_address\n\nCREATE DOMAIN \"app\".\"valid_name\" AS citext\n\nALTER TABLE \"app\".\"accounts\" ADD COLUMN \"handle\" app.valid_name NOT NULL\n\nALTER TABLE \"app\".\"handle_registry\" ADD COLUMN \"handle\" app.valid_name NOT NULL\n\nALTER TABLE \"app\".\"organizations\" ADD COLUMN \"handle\" app.valid_name NOT NULL\n\nALTER TABLE \"app\".\"packages\" ADD COLUMN \"handle\" app.valid_name NOT NULL\n\nALTER TABLE \"app\".\"packages\" ADD COLUMN \"partial_name\" app.valid_name NOT NULL\n\nCREATE TYPE \"app\".\"membership_role\" AS ENUM ('maintainer')\n\nALTER TABLE \"app\".\"members\" ADD COLUMN \"role\" app.membership_role NOT NULL\n\nCREATE TYPE \"app\".\"semver_struct\" AS (\"major\" smallint, \"minor\" smallint, \"patch\" smallint)\n\nCREATE DOMAIN \"app\".\"semver\" AS app.semver_struct\n\nALTER TABLE \"app\".\"package_upgrades\" ADD COLUMN \"from_version_struct\" app.semver NOT NULL\n\nALTER TABLE \"app\".\"package_upgrades\" ADD COLUMN \"to_version_struct\" app.semver NOT NULL\n\nALTER TABLE \"app\".\"package_versions\" ADD COLUMN \"version_struct\" app.semver NOT NULL\n\nCREATE OR REPLACE FUNCTION app.exception(message text)\n RETURNS text\n LANGUAGE plpgsql\nAS $function$\n        begin\n                raise exception using errcode='22000', message=message;\n        end;\n        $function$\n\n\nCREATE OR REPLACE FUNCTION app.is_handle_maintainer(account_id uuid, handle app.valid_name)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    select\n        exists(\n            select\n                1\n            from\n                app.accounts acc\n            where\n                acc.id = $1\n                and acc.handle = $2\n        )\n        or exists(\n            select\n                1\n            from\n                app.organizations o\n                join app.members m\n                    on o.id = m.organization_id\n            where\n                m.role = 'maintainer'\n                and m.account_id = $1\n                and o.handle = $2\n            )\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.is_organization_maintainer(account_id uuid, organization_id uuid)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    -- Does the currently authenticated user have permission to admin orgs and org members?\n    select\n        exists(\n            select\n                1\n            from\n                app.members m\n            where\n                m.account_id = $1\n                and m.organization_id = $2\n                and m.role = 'maintainer'\n        )\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.is_package_maintainer(account_id uuid, package_id uuid)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    select\n        exists(\n            select\n                1\n            from\n                app.accounts acc\n                join app.packages p\n                    on acc.handle = p.handle\n            where\n                acc.id = $1\n                and p.id = $2\n        )\n        or exists(\n            -- current user is maintainer of org that owns the package\n            select\n                1\n            from\n                app.packages p\n                join app.organizations o\n                    on p.handle = o.handle\n                join app.members m\n                    on o.id = m.organization_id\n            where\n                m.role = 'maintainer'\n                and m.account_id = $1\n                and p.id = $2\n            )\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.is_package_version_maintainer(account_id uuid, package_version_id uuid)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    select\n        app.is_package_maintainer($1, pv.package_id)\n    from\n        app.package_versions pv\n    where\n        pv.id = $2\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.is_valid(app.semver_struct)\n RETURNS boolean\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select (\n        ($1).major is not null\n        and ($1).minor is not null\n        and ($1).patch is not null\n    )\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.register_account()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    begin\n        insert into app.handle_registry (handle, is_organization)\n          values (\n            new.raw_user_meta_data ->> 'handle',\n            false\n          );\n\n        insert into app.accounts (id, handle, display_name, bio, contact_email)\n          values (\n            new.id,\n            new.raw_user_meta_data ->> 'handle',\n            new.raw_user_meta_data ->> 'display_name',\n            new.raw_user_meta_data ->> 'bio',\n            new.raw_user_meta_data ->> 'contact_email'\n          );\n          return new;\n    end;\n    $function$\n\n\nCREATE OR REPLACE FUNCTION app.register_organization_creator_as_member()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    begin\n        insert into app.members(organization_id, account_id, role)\n        values (new.id, auth.uid(), 'maintainer');\n\n        return new;\n    end;\n    $function$\n\n\nCREATE OR REPLACE FUNCTION app.semver_exception(version text)\n RETURNS app.semver_struct\n LANGUAGE plpgsql\n IMMUTABLE\nAS $function$\nbegin\n    raise exception using errcode='22000', message=format('Invalid semver %L', version);\nend;\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.semver_to_text(app.semver)\n RETURNS text\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select\n        format('%s.%s.%s', $1.major, $1.minor, $1.patch)\n$function$\n\n\nALTER TABLE \"app\".\"package_upgrades\" ADD COLUMN \"from_version\" text GENERATED ALWAYS AS (app.semver_to_text(from_version_struct)) STORED NOT NULL\n\nALTER TABLE \"app\".\"package_upgrades\" ADD COLUMN \"to_version\" text GENERATED ALWAYS AS (app.semver_to_text(to_version_struct)) STORED NOT NULL\n\nALTER TABLE \"app\".\"package_versions\" ADD COLUMN \"version\" text GENERATED ALWAYS AS (app.semver_to_text(version_struct)) STORED NOT NULL\n\nCREATE OR REPLACE FUNCTION app.simulate_login(email citext)\n RETURNS void\n LANGUAGE sql\nAS $function$\n    /*\n    Simulated JWT of logged in user\n    */\n\n    select\n        set_config(\n            'request.jwt.claims',\n            (\n                select\n                    json_build_object(\n                        'sub',\n                        id,\n                        'role',\n                        'authenticated'\n                    )::text\n                from\n                    auth.users\n                where\n                    email = $1\n            ),\n            true\n        ),\n        set_config('role', 'authenticated', true)\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.text_to_semver(text)\n RETURNS app.semver_struct\n LANGUAGE sql\n IMMUTABLE STRICT\nAS $function$\n    with s(version) as (\n        select (\n            split_part($1, '.', 1),\n            split_part($1, '.', 2),\n            split_part(split_part(split_part($1, '.', 3), '-', 1), '+', 1)\n        )::app.semver_struct\n    )\n    select\n        case app.is_valid(s.version)\n            when true then s.version\n            else app.semver_exception($1)\n       end\n    from\n        s\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.to_package_name(handle app.valid_name, partial_name app.valid_name)\n RETURNS text\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select format('%s-%s', $1, $2)\n$function$\n\n\nALTER TABLE \"app\".\"packages\" ADD COLUMN \"package_name\" text GENERATED ALWAYS AS (app.to_package_name(handle, partial_name)) STORED NOT NULL\n\nCREATE OR REPLACE FUNCTION app.update_avatar_id()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    declare\n        v_handle app.valid_name;\n        v_affected_account app.accounts := null;\n    begin\n        select (string_to_array(new.name, '-'::text))[1]::app.valid_name into v_handle;\n\n        update app.accounts\n        set avatar_id = new.id\n        where handle = v_handle\n        returning * into v_affected_account;\n\n        if not v_affected_account is null then\n            update auth.users u\n            set\n                \"raw_user_meta_data\" = u.raw_user_meta_data || jsonb_build_object(\n                    'avatar_path', new.name\n                )\n            where u.id = v_affected_account.id;\n        else\n            update app.organizations\n            set avatar_id = new.id\n            where handle = v_handle;\n        end if;\n\n        return new;\n    end;\n    $function$\n\n\nCREATE OR REPLACE FUNCTION app.version_text_to_handle(version text)\n RETURNS app.valid_name\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select split_part($1, '-', 1)\n$function$\n\n\nCREATE OR REPLACE FUNCTION app.version_text_to_package_partial_name(version text)\n RETURNS app.valid_name\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select split_part($1, '--', 2)\n$function$\n\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_avatar_id_fkey\" FOREIGN KEY (avatar_id) REFERENCES storage.objects(id)\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_bio_check\" CHECK ((length(bio) <= 512))\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_display_name_check\" CHECK ((length(display_name) <= 128))\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_handle_key\" UNIQUE (handle)\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_id_fkey\" FOREIGN KEY (id) REFERENCES users(id)\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"accounts_pkey\" PRIMARY KEY (id)\n\nALTER DOMAIN \"app\".\"email_address\" ADD CONSTRAINT \"email_address_check\" CHECK ((VALUE ~ '^[a-zA-Z0-9.!#$%&''*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$'::citext))\n\nALTER TABLE \"app\".\"handle_registry\" ADD CONSTRAINT \"handle_registry_handle_is_organization_key\" UNIQUE (handle, is_organization)\n\nALTER TABLE \"app\".\"accounts\" ADD CONSTRAINT \"fk_handle_registry\" FOREIGN KEY (handle, is_organization) REFERENCES app.handle_registry(handle, is_organization)\n\nALTER TABLE \"app\".\"handle_registry\" ADD CONSTRAINT \"handle_registry_pkey\" PRIMARY KEY (handle)\n\nALTER TABLE \"app\".\"members\" ADD CONSTRAINT \"members_account_id_fkey\" FOREIGN KEY (account_id) REFERENCES app.accounts(id)\n\nALTER TABLE \"app\".\"members\" ADD CONSTRAINT \"members_organization_id_account_id_key\" UNIQUE (organization_id, account_id)\n\nALTER TABLE \"app\".\"members\" ADD CONSTRAINT \"members_pkey\" PRIMARY KEY (id)\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"fk_handle_registry\" FOREIGN KEY (handle, is_organization) REFERENCES app.handle_registry(handle, is_organization)\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"organizations_avatar_id_fkey\" FOREIGN KEY (avatar_id) REFERENCES storage.objects(id)\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"organizations_bio_check\" CHECK ((length(bio) <= 512))\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"organizations_display_name_check\" CHECK ((length(display_name) <= 128))\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"organizations_handle_key\" UNIQUE (handle)\n\nALTER TABLE \"app\".\"organizations\" ADD CONSTRAINT \"organizations_pkey\" PRIMARY KEY (id)\n\nALTER TABLE \"app\".\"members\" ADD CONSTRAINT \"members_organization_id_fkey\" FOREIGN KEY (organization_id) REFERENCES app.organizations(id)\n\nALTER TABLE \"app\".\"package_upgrades\" ADD CONSTRAINT \"package_upgrades_package_id_from_version_struct_to_version__key\" UNIQUE (package_id, from_version_struct, to_version_struct)\n\nALTER TABLE \"app\".\"package_upgrades\" ADD CONSTRAINT \"package_upgrades_pkey\" PRIMARY KEY (id)\n\nALTER TABLE \"app\".\"package_versions\" ADD CONSTRAINT \"package_versions_package_id_version_struct_key\" UNIQUE (package_id, version_struct)\n\nALTER TABLE \"app\".\"package_versions\" ADD CONSTRAINT \"package_versions_pkey\" PRIMARY KEY (id)\n\nALTER TABLE \"app\".\"packages\" ADD CONSTRAINT \"packages_handle_fkey\" FOREIGN KEY (handle) REFERENCES app.handle_registry(handle)\n\nALTER TABLE \"app\".\"packages\" ADD CONSTRAINT \"packages_handle_partial_name_key\" UNIQUE (handle, partial_name)\n\nALTER TABLE \"app\".\"packages\" ADD CONSTRAINT \"packages_pkey\" PRIMARY KEY (id)\n\nALTER TABLE \"app\".\"package_upgrades\" ADD CONSTRAINT \"package_upgrades_package_id_fkey\" FOREIGN KEY (package_id) REFERENCES app.packages(id)\n\nALTER TABLE \"app\".\"package_versions\" ADD CONSTRAINT \"package_versions_package_id_fkey\" FOREIGN KEY (package_id) REFERENCES app.packages(id)\n\nALTER DOMAIN \"app\".\"semver\" ADD CONSTRAINT \"semver_check\" CHECK (app.is_valid(VALUE))\n\nALTER DOMAIN \"app\".\"valid_name\" ADD CONSTRAINT \"valid_name_check\" CHECK ((VALUE ~ '^[A-z][A-z0-9\\_]{2,32}$'::citext))\n\nCREATE VIEW \"public\".\"accounts\" AS  SELECT acc.id,\n    acc.handle,\n    obj.name AS avatar_path,\n    acc.display_name,\n    acc.bio,\n    acc.contact_email,\n    acc.created_at\n   FROM (app.accounts acc\n     LEFT JOIN storage.objects obj ON ((acc.avatar_id = obj.id)));\n\nCREATE VIEW \"public\".\"members\" AS  SELECT aio.organization_id,\n    aio.account_id,\n    aio.role,\n    aio.created_at\n   FROM app.members aio;\n\nCREATE VIEW \"public\".\"organizations\" AS  SELECT org.id,\n    org.handle,\n    obj.name AS avatar_path,\n    org.display_name,\n    org.bio,\n    org.contact_email,\n    org.created_at\n   FROM (app.organizations org\n     LEFT JOIN storage.objects obj ON ((org.avatar_id = obj.id)));\n\nCREATE VIEW \"public\".\"package_upgrades\" AS  SELECT pu.id,\n    pu.package_id,\n    pa.package_name,\n    pu.from_version,\n    pu.to_version,\n    pu.sql,\n    pu.created_at\n   FROM (app.packages pa\n     JOIN app.package_upgrades pu ON ((pa.id = pu.package_id)));\n\nCREATE VIEW \"public\".\"package_versions\" AS  SELECT pv.id,\n    pv.package_id,\n    pa.package_name,\n    pv.version,\n    pv.sql,\n    pv.description_md,\n    pa.control_description,\n    pa.control_requires,\n    pv.created_at\n   FROM (app.packages pa\n     JOIN app.package_versions pv ON ((pa.id = pv.package_id)));\n\nCREATE VIEW \"public\".\"packages\" AS  SELECT pa.id,\n    pa.package_name,\n    pa.handle,\n    pa.partial_name,\n    newest_ver.version AS latest_version,\n    newest_ver.description_md,\n    pa.control_description,\n    pa.control_requires,\n    pa.created_at\n   FROM app.packages pa,\n    LATERAL ( SELECT pv.id,\n            pv.package_id,\n            pv.version_struct,\n            pv.version,\n            pv.sql,\n            pv.description_md,\n            pv.created_at\n           FROM app.package_versions pv\n          WHERE (pv.package_id = pa.id)\n          ORDER BY pv.version_struct\n         LIMIT 1) newest_ver;\n\nCREATE OR REPLACE FUNCTION public.search_packages(handle citext DEFAULT NULL::citext, partial_name citext DEFAULT NULL::citext)\n RETURNS SETOF packages\n LANGUAGE sql\n STABLE\nAS $function$\n    select *\n    from public.packages\n    where\n        ($1 is null or handle <% $1 or handle ~ $1)\n        and\n        ($2 is null or partial_name <% $2 or partial_name ~ $2)\n    order by\n        coalesce(extensions.similarity($1, handle), 0) + coalesce(extensions.similar               "CREATE OR REPLACE FUNCTION app.exception(message text)\n RETURNS text\n LANGUAGE plpgsql\nAS $function$\n        begin\n                raise exception using errcode='22000', message=message;\n        end;\n        $function$",
              "CREATE OR REPLACE FUNCTION app.is_handle_maintainer(account_id uuid, handle app.valid_name)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    select\n        exists(\n            select\n                1\n            from\n                app.accounts acc\n            where\n                acc.id = $1\n                and acc.handle = $2\n        )\n        or exists(\n            select\n                1\n            from\n                app.organizations o\n                join app.members m\n                    on o.id = m.organization_id\n            where\n                m.role = 'maintainer'\n                and m.account_id = $1\n                and o.handle = $2\n            )\n$function$",
              "CREATE OR REPLACE FUNCTION app.is_organization_maintainer(account_id uuid, organization_id uuid)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    -- Does the currently authenticated user have permission to admin orgs and org members?\n    select\n        exists(\n            select\n                1\n            from\n                app.members m\n            where\n                m.account_id = $1\n                and m.organization_id = $2\n                and m.role = 'maintainer'\n        )\n$function$",
              "CREATE OR REPLACE FUNCTION app.is_package_maintainer(account_id uuid, package_id uuid)\n RETURNS boolean\n LANGUAGE sql\n STABLE\nAS $function$\n    select\n        exists(\n            select\n                1\n            from\n                app.accounts acc\n                join app.packages p\n                    on acc.handle = p.handle\n            where\n                acc.id = $1\n                and p.id = $2\n        )\n        or exists(\n            -- current user is maintainer of org that owns the package\n            select\n                1\n            from\n                app.packages p\n                join app.organizations o\n                    on p.handle = o.handle\n                join app.members m\n                    on o.id = m.organization_id\n            where\n                m.role = 'maintainer'\n                and m.account_id = $1\n                and p.id = $2\n            )\n$function$",

              "CREATE OR REPLACE FUNCTION app.is_valid(app.semver_struct)\n RETURNS boolean\n LANGUAGE sql\n IMMUTABLE\nAS $function$\n    select (\n        ($1).major is not null\n        and ($1).minor is not null\n        and ($1).patch is not null\n    )\n$function$",
              "CREATE OR REPLACE FUNCTION app.register_account()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    begin\n        insert into app.handle_registry (handle, is_organization)\n          values (\n            new.raw_user_meta_data ->> 'handle',\n            false\n          );",
              "        insert into app.accounts (id, handle, display_name, bio, contact_email)\n          values (\n            new.id,\n            new.raw_user_meta_data ->> 'handle',\n            new.raw_user_meta_data ->> 'display_name',\n            new.raw_user_meta_data ->> 'bio',\n            new.raw_user_meta_data ->> 'contact_email'\n          );\n          return new;\n    end;\n    $function$",
              "CREATE OR REPLACE FUNCTION app.register_organization_creator_as_member()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    begin\n        insert into app.members(organization_id, account_id, role)\n        values (new.id, auth.uid(), 'maintainer');",

              "CREATE OR REPLACE FUNCTION app.simulate_login(email citext)\n RETURNS void\n LANGUAGE sql\nAS $function$\n    /*\n    Simulated JWT of logged in user\n    */",
              "    select\n        set_config(\n            'request.jwt.claims',\n            (\n                select\n                    json_build_object(\n                        'sub',\n                        id,\n                        'role',\n                        'authenticated'\n                    )::text\n                from\n                    auth.users\n                where\n                    email = $1\n            ),\n            true\n        ),\n        set_config('role', 'authenticated', true)\n$function$",
              "CREATE OR REPLACE FUNCTION app.text_to_semver(text)\n RETURNS app.semver_struct\n LANGUAGE sql\n IMMUTABLE STRICT\nAS $function$\n    with s(version) as (\n        select (\n            split_part($1, '.', 1),\n            split_part($1, '.', 2),\n            split_part(split_part(split_part($1, '.', 3), '-', 1), '+', 1)\n        )::app.semver_struct\n    )\n    select\n        case app.is_valid(s.version)\n            when true then s.version\n            else app.semver_exception($1)\n       end\n    from\n        s\n$function$",

              "ALTER TABLE \"app\".\"packages\" ADD COLUMN \"package_name\" text GENERATED ALWAYS AS (app.to_package_name(handle, partial_name)) STORED NOT NULL",
              "CREATE OR REPLACE FUNCTION app.update_avatar_id()\n RETURNS trigger\n LANGUAGE plpgsql\n SECURITY DEFINER\nAS $function$\n    declare\n        v_handle app.valid_name;\n        v_affected_account app.accounts := null;\n    begin\n        select (string_to_array(new.name, '-'::text))[1]::app.valid_name into v_handle;",
              "        update app.accounts\n        set avatar_id = new.id\n        where handle = v_handle\n        returning * into v_affected_account;",

              "CREATE VIEW \"public\".\"accounts\" AS  SELECT acc.id,\n    acc.handle,\n    obj.name AS avatar_path,\n    acc.display_name,\n    acc.bio,\n    acc.contact_email,\n    acc.created_at\n   FROM (app.accounts acc\n     LEFT JOIN storage.objects obj ON ((acc.avatar_id = obj.id)));",

              "CREATE VIEW \"public\".\"package_upgrades\" AS  SELECT pu.id,\n    pu.package_id,\n    pa.package_name,\n    pu.from_version,\n    pu.to_version,\n    pu.sql,\n    pu.created_at\n   FROM (app.packages pa\n     JOIN app.package_upgrades pu ON ((pa.id = pu.package_id)));",
              "CREATE VIEW \"public\".\"package_versions\" AS  SELECT pv.id,\n    pv.package_id,\n    pa.package_name,\n    pv.version,\n    pv.sql,\n    pv.description_md,\n    pa.control_description,\n    pa.control_requires,\n    pv.created_at\n   FROM (app.packages pa\n     JOIN app.package_versions pv ON ((pa.id = pv.package_id)));",
              "CREATE VIEW \"public\".\"packages\" AS  SELECT pa.id,\n    pa.package_name,\n    pa.handle,\n    pa.partial_name,\n    newest_ver.version AS latest_version,\n    newest_ver.description_md,\n    pa.control_description,\n    pa.control_requires,\n    pa.created_at\n   FROM app.packages pa,\n    LATERAL ( SELECT pv.id,\n            pv.package_id,\n            pv.version_struct,\n            pv.version,\n            pv.sql,\n            pv.description_md,\n            pv.created_at\n           FROM app.package_versions pv\n          WHERE (pv.package_id = pa.id)\n          ORDER BY pv.version_struct\n         LIMIT 1) newest_ver;",
              "CREATE OR REPLACE FUNCTION public.search_packages(handle citext DEFAULT NULL::citext, partial_name citext DEFAULT NULL::citext)\n RETURNS SETOF packages\n LANGUAGE sql\n STABLE\nAS $function$\n    select *\n    from public.packages\n    where\n        ($1 is null or handle <% $1 or handle ~ $1)\n        and\n        ($2 is null or partial_name <% $2 or partial_name ~ $2)\n    order by\n        coalesce(extensions.similarity($1, handle), 0) + coalesce(extensions.similarity($2, partial_name), 0) desc,\n        created_at desc;\n$function$",

              "CREATE POLICY \"package_upgrades_select_policy\" ON \"app\".\"package_upgrades\" FOR SELECT TO PUBLIC USING (true)",
              "CREATE POLICY \"package_upgrades_update_policy\" ON \"app\".\"package_upgrades\" FOR UPDATE TO \"authenticated\" USING (app.is_package_maintainer(uid(), package_id))",

    <script>
      const BUCKET_COLORS = {
        "both-converge": "#1a7f37",
        "old-fingerprint-gate": "#0969da",
        "accepted-difference-acl": "#bf8700",
        "old-fails-new-converges": "#bf8700",
        "new-fails-old-converges": "#cf222e",
        "both-fail": "#cf222e",
        "not-checked": "#656d76",
      };
      const payload = JSON.parse(
        document.getElementById("payload").textContent,
      );

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function bucketBadge(bucket) {
        const color = BUCKET_COLORS[bucket] || "#656d76";
        return (
          '<span class="badge" style="background:' +
          color +
          '">' +
          esc(bucket) +
          "</span>"
        );
      }

      function formatMs(ms) {
        return ms < 10 ? ms.toFixed(1) : Math.round(ms).toString();
      }

      function scrollToScenario(id) {
        const el = document.getElementById("scenario-" + id);
        if (!el) return;
        el.classList.add("open");
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        document
          .querySelectorAll("#summary-body tr")
          .forEach((r) => r.classList.remove("highlight"));
        const row = document.querySelector(
          '#summary-body tr[data-id="' + id + '"]',
        );
        if (row) row.classList.add("highlight");
        document
          .querySelectorAll("nav a")
          .forEach((a) => a.classList.toggle("active", a.dataset.id === id));
      }

      function renderMeta() {
        document.getElementById("meta").innerHTML =
          "Run: <code>" +
          esc(payload.runDir) +
          "</code> · Generated " +
          new Date(payload.generatedAt).toLocaleString();
      }

      function renderCards() {
        const s = payload.summary;
        const cards = [
          ["Scenarios", s.scenarioCount],
          ["Stmt mismatches", s.stmtCountMismatches],
          ["Median speedup", s.medianSpeedup + "×"],
          ["Prove failed", s.proveFailed],
        ];
        document.getElementById("cards").innerHTML = cards
          .map(
            ([l, v]) =>
              '<div class="card"><div class="label">' +
              esc(l) +
              '</div><div class="value">' +
              esc(v) +
              "</div></div>",
          )
          .join("");
      }

      function makeChartClickHandler(labels) {
        return (_evt, elements) => {
          if (!elements.length) return;
          scrollToScenario(labels[elements[0].index]);
        };
      }

      function renderCharts() {
        const charts = payload.summary.charts;
        const section = document.getElementById("charts");
        section.innerHTML =
          '<div class="chart-box"><h3>Plan time (ms)</h3><canvas id="chart-plan"></canvas></div>' +
          '<div class="chart-box"><h3>Speedup ratio</h3>' +
          '<div class="chart-controls"><label><input type="checkbox" id="log-speedup" /> Log scale</label></div>' +
          '<canvas id="chart-speedup"></canvas></div>' +
          '<div class="chart-box"><h3>Statement counts</h3><canvas id="chart-stmts"></canvas></div>' +
          '<div class="chart-box"><h3>Apply buckets</h3><canvas id="chart-buckets"></canvas></div>';

        const planCtx = document.getElementById("chart-plan");
        new Chart(planCtx, {
          type: "bar",
          data: {
            labels: charts.planTime.labels,
            datasets: [
              {
                label: "Old (pg-delta)",
                data: charts.planTime.oldMs,
                backgroundColor: "#8b949e",
              },
              {
                label: "New (pg-delta-next)",
                data: charts.planTime.newMs,
                backgroundColor: "#1a7f37",
              },
            ],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            onClick: makeChartClickHandler(charts.planTime.labels),
            plugins: { legend: { position: "bottom" } },
            scales: { x: { beginAtZero: true } },
          },
        });

        const speedupData = charts.speedup.ratios;
        const speedupChart = new Chart(
          document.getElementById("chart-speedup"),
          {
            type: "bar",
            data: {
              labels: charts.speedup.labels,
              datasets: [
                {
                  label: "Speedup ×",
                  data: speedupData,
                  backgroundColor: "#0969da",
                },
              ],
            },
            options: {
              indexAxis: "y",
              responsive: true,
              onClick: makeChartClickHandler(charts.speedup.labels),
              plugins: { legend: { display: false } },
              scales: { x: { beginAtZero: true } },
            },
          },
        );
        document
          .getElementById("log-speedup")
          .addEventListener("change", (e) => {
            speedupChart.options.scales.x.type = e.target.checked
              ? "logarithmic"
              : "linear";
            speedupChart.update();
          });

        new Chart(document.getElementById("chart-stmts"), {
          type: "bar",
          data: {
            labels: charts.stmtCounts.labels,
            datasets: [
              {
                label: "Old",
                data: charts.stmtCounts.old,
                backgroundColor: "#8b949e",
              },
              {
                label: "New",
                data: charts.stmtCounts.new,
                backgroundColor: "#1a7f37",
              },
            ],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            onClick: makeChartClickHandler(charts.stmtCounts.labels),
            plugins: { legend: { position: "bottom" } },
            scales: { x: { beginAtZero: true } },
          },
        });

        new Chart(document.getElementById("chart-buckets"), {
          type: "doughnut",
          data: {
            labels: charts.applyBuckets.map((b) => b.bucket),
            datasets: [
              {
                data: charts.applyBuckets.map((b) => b.count),
                backgroundColor: charts.applyBuckets.map(
                  (b) => BUCKET_COLORS[b.bucket] || "#656d76",
                ),
              },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { position: "bottom" } },
          },
        });
      }

      function renderFilters() {
        const filters = [
          {
            id: "filter-mismatch",
            label: "Stmt count differs",
            test: (s) => s.stmtCountMismatch,
          },
          {
            id: "filter-diff",
            label: "Non-empty diff",
            test: (s) => s.hasDiff,
          },
          {
            id: "filter-not-converge",
            label: "Not both-converge",
            test: (s) =>
              (s.applyCheck?.bucket ?? "not-checked") !== "both-converge",
          },
          {
            id: "filter-prove-fail",
            label: "Prove failed",
            test: (s) => s.prove !== undefined && !s.prove.ok,
          },
        ];
        document.getElementById("filters").innerHTML = filters
          .map(
            (f) =>
              '<label><input type="checkbox" id="' +
              f.id +
              '" data-filter="' +
              f.id +
              '" /> ' +
              esc(f.label) +
              "</label>",
          )
          .join("");
        document.querySelectorAll("#filters input").forEach((cb) => {
          cb.addEventListener("change", applyFilters);
        });
      }

      function applyFilters() {
        const active = [
          ...document.querySelectorAll("#filters input:checked"),
        ].map((cb) => cb.id);
        const filterFns = {
          "filter-mismatch": (s) => s.stmtCountMismatch,
          "filter-diff": (s) => s.hasDiff,
          "filter-not-converge": (s) =>
            (s.applyCheck?.bucket ?? "not-checked") !== "both-converge",
          "filter-prove-fail": (s) => s.prove !== undefined && !s.prove.ok,
        };
        payload.scenarios.forEach((s) => {
          const show =
            active.length === 0 || active.every((id) => filterFns[id](s));
          const row = document.querySelector(
            '#summary-body tr[data-id="' + s.dirName + '"]',
          );
          const panel = document.getElementById("scenario-" + s.dirName);
          if (row) row.classList.toggle("hidden", !show);
          if (panel) panel.style.display = show ? "" : "none";
        });
      }

      function renderSummaryTable() {
        const tbody = document.getElementById("summary-body");
        tbody.innerHTML = payload.scenarios
          .map((s) => {
            const bucket = s.applyCheck?.bucket ?? "not-checked";
            const prove =
              s.prove === undefined ? "n/a" : s.prove.ok ? "ok" : "FAIL";
            const classes = [s.stmtCountMismatch ? "mismatch" : ""]
              .filter(Boolean)
              .join(" ");
            return (
              '<tr data-id="' +
              esc(s.dirName) +
              '" class="' +
              classes +
              '">' +
              '<td><a href="#scenario-' +
              esc(s.dirName) +
              '">' +
              esc(s.dirName) +
              "</a></td>" +
              "<td>" +
              esc(s.kind) +
              "</td>" +
              "<td>" +
              s.metrics.old.statementCount +
              "</td>" +
              "<td>" +
              s.metrics.new.statementCount +
              "</td>" +
              "<td>" +
              formatMs(s.metrics.timing.oldPlanMs) +
              " → " +
              formatMs(s.metrics.timing.newPlanMs) +
              "</td>" +
              "<td>" +
              (s.speedupRatio > 0 ? s.speedupRatio.toFixed(1) + "×" : "—") +
              "</td>" +
              "<td>" +
              bucketBadge(bucket) +
              "</td>" +
              "<td>" +
              esc(prove) +
              "</td>" +
              "<td>" +
              (s.hasDiff ? "yes" : "no") +
              "</td></tr>"
            );
          })
          .join("");
        tbody.querySelectorAll("a").forEach((a) => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            scrollToScenario(a.getAttribute("href").replace("#scenario-", ""));
          });
        });
      }

      function renderNav() {
        document.getElementById("nav").innerHTML =
          "<h2>Scenarios</h2>" +
          payload.scenarios
            .map((s) => {
              const bucket = s.applyCheck?.bucket ?? "not-checked";
              const color = BUCKET_COLORS[bucket] || "#656d76";
              const short = s.dirName
                .replace(/^corpus-/, "")
                .replace(/^dbdev-fixture-/, "dbdev-");
              return (
                '<a href="#scenario-' +
                esc(s.dirName) +
                '" data-id="' +
                esc(s.dirName) +
                '">' +
                '<span class="dot" style="background:' +
                color +
                '"></span>' +
                esc(short) +
                "</a>"
              );
            })
            .join("");
        document.querySelectorAll("nav a").forEach((a) => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            scrollToScenario(a.dataset.id);
          });
        });
      }

      function lockClassBar(safety) {
        if (!safety?.lockClasses) return "";
        const lc = safety.lockClasses;
        const total = Object.values(lc).reduce((a, b) => a + b, 0);
        if (total === 0) return "";
        const colors = {
          accessExclusive: "#cf222e",
          shareRowExclusive: "#bf8700",
          share: "#0969da",
          none: "#656d76",
        };
        let html = '<div class="mini-chart" title="Lock classes">';
        for (const [k, v] of Object.entries(lc)) {
          if (!v) continue;
          const pct = ((100 * v) / total).toFixed(1);
          html +=
            '<span style="display:inline-block;height:100%;width:' +
            pct +
            "%;background:" +
            (colors[k] || "#ccc") +
            '" title="' +
            k +
            ": " +
            v +
            '"></span>';
        }
        return html + "</div>";
      }

      function safetyChips(safety) {
        if (!safety) return "";
        const chips = [];
        if (safety.destructiveActions)
          chips.push(
            '<span class="chip error">destructive: ' +
              safety.destructiveActions +
              "</span>",
          );
        if (safety.rewriteRiskActions)
          chips.push(
            '<span class="chip warn">rewrite-risk: ' +
              safety.rewriteRiskActions +
              "</span>",
          );
        if (safety.nonTransactionalActions)
          chips.push(
            '<span class="chip warn">non-txn: ' +
              safety.nonTransactionalActions +
              "</span>",
          );
        return chips.join("");
      }

      function renderScenario(s, idx) {
        const bucket = s.applyCheck?.bucket ?? "not-checked";
        const id = s.dirName;
        const maxRows = Math.max(
          s.metrics.old.statements.length,
          s.newStatements.length,
        );
        let stmtRows = "";
        for (let i = 0; i < maxRows; i++) {
          stmtRows +=
            "<tr><th>" +
            (i + 1) +
            "</th>" +
            "<td><code>" +
            esc(s.metrics.old.statements[i] ?? "—") +
            "</code></td>" +
            "<td><code>" +
            esc(s.newStatements[i] ?? "—") +
            "</code></td></tr>";
        }
        return (
          '<article class="scenario" id="scenario-' +
          esc(id) +
          '" data-idx="' +
          idx +
          '">' +
          '<div class="scenario-header">' +
          '<span class="chevron">▶</span>' +
          "<h2>" +
          esc(id) +
          "</h2>" +
          bucketBadge(bucket) +
          '<span class="chip">' +
          s.metrics.old.statementCount +
          " → " +
          s.metrics.new.statementCount +
          " stmts</span>" +
          '<span class="chip">' +
          formatMs(s.metrics.timing.oldPlanMs) +
          "ms → " +
          formatMs(s.metrics.timing.newPlanMs) +
          "ms</span>" +
          "</div>" +
          '<div class="scenario-body">' +
          (s.planError
            ? '<div class="error-box">Plan error: ' +
              esc(s.planError) +
              "</div>"
            : "") +
          '<div class="metrics-strip">' +
          '<span class="chip">profile: ' +
          esc(s.metrics.profile) +
          "</span>" +
          safetyChips(s.metrics.new.safetyReport) +
          (s.applyCheck?.note
            ? '<span class="chip warn">' + esc(s.applyCheck.note) + "</span>"
            : "") +
          "</div>" +
          lockClassBar(s.metrics.new.safetyReport) +
          '<div class="tabs" data-scenario="' +
          esc(id) +
          '">' +
          '<button class="tab active" data-tab="side">Side by side</button>' +
          '<button class="tab" data-tab="diff">Unified diff</button>' +
          '<button class="tab" data-tab="stmts">Statements</button>' +
          "</div>" +
          '<div class="tab-panel active" data-panel="side">' +
          '<div class="sql-panes">' +
          '<div class="sql-pane"><div class="pane-label old">old.sql (pg-delta)</div>' +
          '<div class="sql-scroll"><pre class="hljs-sql"><code>' +
          esc(s.oldSql) +
          "</code></pre></div></div>" +
          '<div class="sql-pane"><div class="pane-label new">new.sql (pg-delta-next)</div>' +
          '<div class="sql-scroll"><pre class="hljs-sql"><code>' +
          esc(s.newSql) +
          "</code></pre></div></div>" +
          "</div></div>" +
          '<div class="tab-panel" data-panel="diff"><div class="diff-container" data-diff="' +
          idx +
          '"></div></div>' +
          '<div class="tab-panel" data-panel="stmts"><table class="stmt-table"><thead><tr><th>#</th><th>Old</th><th>New</th></tr></thead><tbody>' +
          stmtRows +
          "</tbody></table></div>" +
          (s.applyCheck
            ? '<details class="collapsible"><summary>apply-check.json</summary><pre>' +
              esc(JSON.stringify(s.applyCheck, null, 2)) +
              "</pre></details>"
            : "") +
          (s.prove
            ? '<details class="collapsible"><summary>prove.json (ok=' +
              s.prove.ok +
              ")</summary><pre>" +
              esc(JSON.stringify(s.prove, null, 2)) +
              "</pre></details>"
            : "") +
          "</div></article>"
        );
      }

      const renderedDiffs = new Set();

      function initScenarioPanel(el) {
        const idx = el.dataset.idx;
        el.querySelector(".scenario-header").addEventListener("click", () => {
          el.classList.toggle("open");
          if (el.classList.contains("open")) {
            el.querySelectorAll("pre code").forEach((block) => {
              if (typeof hljs !== "undefined") hljs.highlightElement(block);
            });
            const diffEl = el.querySelector('[data-diff="' + idx + '"]');
            if (
              diffEl &&
              !renderedDiffs.has(idx) &&
              typeof Diff2Html !== "undefined"
            ) {
              const s = payload.scenarios[Number(idx)];
              const html = Diff2Html.html(s.sqlDiff, {
                drawFileList: false,
                matching: "lines",
                outputFormat: "side-by-side",
              });
              diffEl.innerHTML = html;
              renderedDiffs.add(idx);
            }
            syncScroll(el);
          }
        });

        el.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", (e) => {
            e.stopPropagation();
            const name = tab.dataset.tab;
            el.querySelectorAll(".tab").forEach((t) =>
              t.classList.toggle("active", t.dataset.tab === name),
            );
            el.querySelectorAll(".tab-panel").forEach((p) =>
              p.classList.toggle("active", p.dataset.panel === name),
            );
            if (name === "diff" && el.classList.contains("open")) {
              const diffEl = el.querySelector('[data-diff="' + idx + '"]');
              if (
                diffEl &&
                !renderedDiffs.has(idx) &&
                typeof Diff2Html !== "undefined"
              ) {
                const s = payload.scenarios[Number(idx)];
                diffEl.innerHTML = Diff2Html.html(s.sqlDiff, {
                  drawFileList: false,
                  matching: "lines",
                  outputFormat: "side-by-side",
                });
                renderedDiffs.add(idx);
              }
            }
          });
        });
      }

      function syncScroll(el) {
        const panes = el.querySelectorAll(".sql-scroll");
        if (panes.length !== 2) return;
        let syncing = false;
        panes[0].addEventListener("scroll", () => {
          if (syncing) return;
          syncing = true;
          panes[1].scrollTop = panes[0].scrollTop;
          panes[1].scrollLeft = panes[0].scrollLeft;
          syncing = false;
        });
        panes[1].addEventListener("scroll", () => {
          if (syncing) return;
          syncing = true;
          panes[0].scrollTop = panes[1].scrollTop;
          panes[0].scrollLeft = panes[1].scrollLeft;
          syncing = false;
        });
      }

      function renderScenarios() {
        const container = document.getElementById("scenarios");
        container.innerHTML = payload.scenarios.map(renderScenario).join("");
        container.querySelectorAll(".scenario").forEach(initScenarioPanel);
      }

      renderMeta();
      renderCards();
      renderCharts();
      renderFilters();
      renderSummaryTable();
      renderNav();
      renderScenarios();

      if (location.hash.startsWith("#scenario-")) {
        scrollToScenario(location.hash.replace("#scenario-", ""));
      }
    </script>
  </body>
</html>
